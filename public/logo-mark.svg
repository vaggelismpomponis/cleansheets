<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ephtopia-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Top Highlight -->
    <linearGradient id="ephtopia-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle Gold-Mint Gradient -->
    <linearGradient id="ephtopia-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="ephtopia-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.3" />
    </filter>

    <filter id="sparkle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Shadow -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ephtopia-bg-grad)" filter="url(#ephtopia-shadow)" />
  
  <!-- Subtle Inner Border / Glass Edge -->
  <rect x="6.5" y="6.5" width="107" height="107" rx="27.5" stroke="url(#ephtopia-shine)" stroke-width="1.5" fill="none" />

  <!-- Sheet Wave 1 (Top / Upper Arc of E) -->
  <path d="M34 40 C 34 35, 42 32, 54 32 C 68 32, 78 37, 82 41 C 83.5 42.5, 82 45, 79.5 44.5 C 72 43, 62 42.5, 52 44.5 C 44 46, 38 48.5, 34 52 Z" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Sheet Wave 2 (Middle Bar & Spine of E) -->
  <path d="M32 36 C 33 36, 34 37, 34 39 L 34 81 C 34 83, 32 84, 30.5 83 C 29.5 82, 29 80.5, 29 79 L 29 38 C 29 36.8, 30.5 36, 32 36 Z" fill="#FFFFFF" fill-opacity="0.9" />
  
  <path d="M34 58 C 42 56, 52 55.5, 62 57 C 67 57.8, 70 59, 71.5 60.5 C 72.5 61.5, 71.5 63, 69.5 63 C 61 62.5, 50 63.5, 34 68 Z" fill="#FFFFFF" fill-opacity="0.85" />

  <!-- Sheet Wave 3 (Bottom Arc / Fresh Bedding Fold) -->
  <path d="M34 76 C 42 74, 56 73.5, 68 76 C 76 77.8, 83 81.5, 87 85 C 88.5 86.3, 87 88.5, 84.5 88 C 74 86, 60 84.5, 48 86.5 C 41 87.8, 36 90, 32 93 C 30.5 94.2, 29 93, 29.5 91 C 31 85, 32.5 80, 34 76 Z" fill="#FFFFFF" />

  <!-- Dynamic Sparkling Stars (Spotless Cleaning Iconography) -->
  <!-- Main Star -->
  <g transform="translate(86, 32)" filter="url(#sparkle-glow)">
    <path d="M0 -15 C 0.8 -4, 4 -0.8, 15 0 C 4 0.8, 0.8 4, 0 15 C -0.8 4, -4 0.8, -15 0 C -4 -0.8, -0.8 -4, 0 -15 Z" fill="url(#ephtopia-sparkle)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Secondary Little Sparkle -->
  <g transform="translate(74, 18) scale(0.45)">
    <path d="M0 -12 C 0.6 -3, 3 -0.6, 12 0 C 3 0.6, 0.6 3, 0 12 C -0.6 3, -3 0.6, -12 0 C -3 -0.6, -0.6 -3, 0 -12 Z" fill="#FCD34D" />
  </g>
</svg>
