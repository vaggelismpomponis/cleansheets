  <path d="M34 40 C 34 35, 42 32, 54 32 C 68 32, 78 37, 82 41 C 83.5 42.5, 82 45, 79.5 44.5 C 72 43, 62 42.5, 52 44.5 C 44 46, 38 48.5, 34 52 Z" fill="#FFFFFF" fill-opacity="0.96" />

