    <path d="M0 -15 C 0.8 -4, 4 -0.8, 15 0 C 4 0.8, 0.8 4, 0 15 C -0.8 4, -4 0.8, -15 0 C -4 -0.8, -0.8 -4, 0 -15 Z" fill="url(#favicon-sparkle)" />
