  <path d="M34 76 C 42 74, 56 73.5, 68 76 C 76 77.8, 83 81.5, 87 85 C 88.5 86.3, 87 88.5, 84.5 88 C 74 86, 60 84.5, 48 86.5 C 41 87.8, 36 90, 32 93 C 30.5 94.2, 29 93, 29.5 91 C 31 85, 32.5 80, 34 76 Z" fill="#FFFFFF" />

