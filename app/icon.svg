      <stop offset="60%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#favicon-bg)" />
  <rect x="1" y="1" width="118" height="118" rx="29" stroke="url(#favicon-shine)" stroke-width="2" fill="none" />

